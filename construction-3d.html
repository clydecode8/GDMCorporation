<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction 3D Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        
        p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="info">
            <h1>🏠 House Construction</h1>
            <p>Floating blocks assembling into a real house</p>
            <p>Entire structure rotates as a whole</p>
            <p>🖱️ Drag to rotate • Scroll to zoom • Right-click to pan</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/controls/OrbitControls.js"></script>
    <script>
        // Wait for scripts to load
        window.addEventListener('load', function() {
            if (typeof THREE === 'undefined') {
                console.error('Three.js failed to load!');
                document.body.innerHTML = '<div style="color: white; text-align: center; padding: 50px; font-size: 24px;">Error: Three.js failed to load. Please check your internet connection and refresh the page.</div>';
                return;
            }
            
            console.log('Three.js loaded successfully!');
            initScene();
        });
        
        function initScene() {

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x1e3c72);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        // Ensure the container exists
        const container = document.getElementById('container');
        if (container) {
            container.appendChild(renderer.domElement);
            console.log('Renderer added to container successfully');
        } else {
            console.error('Container element not found!');
        }

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // Point light for hard hat glow
        const pointLight = new THREE.PointLight(0xffeb3b, 1, 10);
        pointLight.position.set(0, 5, 0);
        scene.add(pointLight);

        // Materials are defined in the house structure section

        // Create house structure group first
        const houseGroup = new THREE.Group();
        houseGroup.position.set(0, 0, 0);
        scene.add(houseGroup);

        // Create detailed house structure
        const houseElements = [];
        
        // Materials for different parts
        const wallMaterial = new THREE.MeshLambertMaterial({ color: 0xf5f5f5 }); // Off-white walls
        const roofMaterial = new THREE.MeshLambertMaterial({ color: 0xff6b35 }); // Orange roof
        const foundationMaterial = new THREE.MeshLambertMaterial({ color: 0x8b7355 }); // Brown foundation
        const windowMaterial = new THREE.MeshLambertMaterial({ color: 0x87ceeb, transparent: true, opacity: 0.7 }); // Sky blue windows
        const windowFrameMaterial = new THREE.MeshLambertMaterial({ color: 0xffffff }); // White window frames
        const doorMaterial = new THREE.MeshLambertMaterial({ color: 0x8b4513 }); // Brown door
        const awningMaterial = new THREE.MeshLambertMaterial({ color: 0xffd700 }); // Gold awnings
        const chimneyMaterial = new THREE.MeshLambertMaterial({ color: 0xffffff }); // White chimney
        const chimneyTopMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 }); // Dark chimney top
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x90ee90 }); // Light green ground
        const pathMaterial = new THREE.MeshLambertMaterial({ color: 0x808080 }); // Grey path

        // Ground/Base
        const groundGeometry = new THREE.BoxGeometry(12, 0.2, 12);
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.position.set(0, -0.1, 0);
        ground.receiveShadow = true;
        houseElements.push({ mesh: ground, targetY: -0.1, delay: 0 });

        // Foundation
        const foundationGeometry = new THREE.BoxGeometry(8, 0.5, 8);
        const foundation = new THREE.Mesh(foundationGeometry, foundationMaterial);
        foundation.position.set(0, 0.25, 0);
        foundation.castShadow = true;
        foundation.receiveShadow = true;
        houseElements.push({ mesh: foundation, targetY: 0.25, delay: 100 });

        // Main house body (ground floor)
        const houseBodyGeometry = new THREE.BoxGeometry(7, 2, 7);
        const houseBody = new THREE.Mesh(houseBodyGeometry, wallMaterial);
        houseBody.position.set(0, 1.5, 0);
        houseBody.castShadow = true;
        houseBody.receiveShadow = true;
        houseElements.push({ mesh: houseBody, targetY: 1.5, delay: 200 });

        // Second floor
        const secondFloorGeometry = new THREE.BoxGeometry(7, 1.5, 7);
        const secondFloor = new THREE.Mesh(secondFloorGeometry, wallMaterial);
        secondFloor.position.set(0, 3.25, 0);
        secondFloor.castShadow = true;
        secondFloor.receiveShadow = true;
        houseElements.push({ mesh: secondFloor, targetY: 3.25, delay: 300 });

        // Roof base
        const roofBaseGeometry = new THREE.BoxGeometry(8, 0.3, 8);
        const roofBase = new THREE.Mesh(roofBaseGeometry, roofMaterial);
        roofBase.position.set(0, 4.5, 0);
        roofBase.castShadow = true;
        roofBase.receiveShadow = true;
        houseElements.push({ mesh: roofBase, targetY: 4.5, delay: 400 });

        // Roof slopes (triangular prism effect)
        const roofSlopeGeometry = new THREE.BoxGeometry(8, 1, 8);
        const roofSlope = new THREE.Mesh(roofSlopeGeometry, roofMaterial);
        roofSlope.position.set(0, 5.5, 0);
        roofSlope.rotation.x = Math.PI / 6; // 30 degrees
        roofSlope.castShadow = true;
        roofSlope.receiveShadow = true;
        houseElements.push({ mesh: roofSlope, targetY: 5.5, delay: 500 });

        // Chimney
        const chimneyGeometry = new THREE.BoxGeometry(0.8, 2, 0.8);
        const chimney = new THREE.Mesh(chimneyGeometry, chimneyMaterial);
        chimney.position.set(2, 6.5, 0);
        chimney.castShadow = true;
        chimney.receiveShadow = true;
        houseElements.push({ mesh: chimney, targetY: 6.5, delay: 600 });

        // Chimney top
        const chimneyTopGeometry = new THREE.BoxGeometry(1, 0.3, 1);
        const chimneyTop = new THREE.Mesh(chimneyTopGeometry, chimneyTopMaterial);
        chimneyTop.position.set(2, 7.65, 0);
        chimneyTop.castShadow = true;
        chimneyTop.receiveShadow = true;
        houseElements.push({ mesh: chimneyTop, targetY: 7.65, delay: 700 });

        // Front door
        const doorGeometry = new THREE.BoxGeometry(1.2, 2, 0.1);
        const door = new THREE.Mesh(doorGeometry, doorMaterial);
        door.position.set(0, 1, -3.6);
        door.castShadow = true;
        door.receiveShadow = true;
        houseElements.push({ mesh: door, targetY: 1, delay: 800 });

        // Door columns
        const columnGeometry = new THREE.BoxGeometry(0.3, 2.5, 0.3);
        const leftColumn = new THREE.Mesh(columnGeometry, windowFrameMaterial);
        leftColumn.position.set(-1.5, 1.25, -3.6);
        leftColumn.castShadow = true;
        leftColumn.receiveShadow = true;
        houseElements.push({ mesh: leftColumn, targetY: 1.25, delay: 850 });

        const rightColumn = new THREE.Mesh(columnGeometry, windowFrameMaterial);
        rightColumn.position.set(1.5, 1.25, -3.6);
        rightColumn.castShadow = true;
        rightColumn.receiveShadow = true;
        houseElements.push({ mesh: rightColumn, targetY: 1.25, delay: 850 });

        // Door overhang
        const overhangGeometry = new THREE.BoxGeometry(3.5, 0.2, 1);
        const overhang = new THREE.Mesh(overhangGeometry, roofMaterial);
        overhang.position.set(0, 2.75, -3.6);
        overhang.castShadow = true;
        overhang.receiveShadow = true;
        houseElements.push({ mesh: overhang, targetY: 2.75, delay: 900 });

        // Steps
        const stepsGeometry = new THREE.BoxGeometry(2, 0.2, 1);
        const steps = new THREE.Mesh(stepsGeometry, pathMaterial);
        steps.position.set(0, 0.1, -4.5);
        steps.castShadow = true;
        steps.receiveShadow = true;
        houseElements.push({ mesh: steps, targetY: 0.1, delay: 950 });

        // Windows - Ground floor left side
        const windowGeometry = new THREE.BoxGeometry(1, 1, 0.1);
        const windowFrameGeometry = new THREE.BoxGeometry(1.2, 1.2, 0.05);
        
        // Left side windows
        const leftWindow1 = new THREE.Mesh(windowGeometry, windowMaterial);
        leftWindow1.position.set(-3.6, 1, -1);
        leftWindow1.castShadow = true;
        houseElements.push({ mesh: leftWindow1, targetY: 1, delay: 1000 });

        const leftWindow1Frame = new THREE.Mesh(windowFrameGeometry, windowFrameMaterial);
        leftWindow1Frame.position.set(-3.6, 1, -1);
        leftWindow1Frame.castShadow = true;
        houseElements.push({ mesh: leftWindow1Frame, targetY: 1, delay: 1000 });

        const leftWindow2 = new THREE.Mesh(windowGeometry, windowMaterial);
        leftWindow2.position.set(-3.6, 1, 1);
        leftWindow2.castShadow = true;
        houseElements.push({ mesh: leftWindow2, targetY: 1, delay: 1050 });

        const leftWindow2Frame = new THREE.Mesh(windowFrameGeometry, windowFrameMaterial);
        leftWindow2Frame.position.set(-3.6, 1, 1);
        leftWindow2Frame.castShadow = true;
        houseElements.push({ mesh: leftWindow2Frame, targetY: 1, delay: 1050 });

        // Right side window
        const rightWindow = new THREE.Mesh(windowGeometry, windowMaterial);
        rightWindow.position.set(3.6, 1, 0);
        rightWindow.castShadow = true;
        houseElements.push({ mesh: rightWindow, targetY: 1, delay: 1100 });

        const rightWindowFrame = new THREE.Mesh(windowFrameGeometry, windowFrameMaterial);
        rightWindowFrame.position.set(3.6, 1, 0);
        rightWindowFrame.castShadow = true;
        houseElements.push({ mesh: rightWindowFrame, targetY: 1, delay: 1100 });

        // Upper floor window
        const upperWindow = new THREE.Mesh(windowGeometry, windowMaterial);
        upperWindow.position.set(-3.6, 3.25, 0);
        upperWindow.castShadow = true;
        houseElements.push({ mesh: upperWindow, targetY: 3.25, delay: 1150 });

        const upperWindowFrame = new THREE.Mesh(windowFrameGeometry, windowFrameMaterial);
        upperWindowFrame.position.set(-3.6, 3.25, 0);
        upperWindowFrame.castShadow = true;
        houseElements.push({ mesh: upperWindowFrame, targetY: 3.25, delay: 1150 });

        // Dormer window
        const dormerGeometry = new THREE.BoxGeometry(1.5, 1, 0.1);
        const dormer = new THREE.Mesh(dormerGeometry, windowMaterial);
        dormer.position.set(0, 5.5, -3.6);
        dormer.castShadow = true;
        houseElements.push({ mesh: dormer, targetY: 5.5, delay: 1200 });

        const dormerFrame = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.2, 0.05), windowFrameMaterial);
        dormerFrame.position.set(0, 5.5, -3.6);
        dormerFrame.castShadow = true;
        houseElements.push({ mesh: dormerFrame, targetY: 5.5, delay: 1200 });

        // Awnings
        const awningGeometry = new THREE.BoxGeometry(1.5, 0.1, 0.8);
        
        const leftAwning1 = new THREE.Mesh(awningGeometry, awningMaterial);
        leftAwning1.position.set(-3.6, 1.6, -1);
        leftAwning1.castShadow = true;
        houseElements.push({ mesh: leftAwning1, targetY: 1.6, delay: 1250 });

        const leftAwning2 = new THREE.Mesh(awningGeometry, awningMaterial);
        leftAwning2.position.set(-3.6, 1.6, 1);
        leftAwning2.castShadow = true;
        houseElements.push({ mesh: leftAwning2, targetY: 1.6, delay: 1250 });

        const rightAwning = new THREE.Mesh(awningGeometry, awningMaterial);
        rightAwning.position.set(3.6, 1.6, 0);
        rightAwning.castShadow = true;
        houseElements.push({ mesh: rightAwning, targetY: 1.6, delay: 1300 });

        // Path
        const pathGeometry = new THREE.BoxGeometry(1, 0.1, 3);
        const path = new THREE.Mesh(pathGeometry, pathMaterial);
        path.position.set(0, 0.05, -6);
        path.castShadow = true;
        path.receiveShadow = true;
        houseElements.push({ mesh: path, targetY: 0.05, delay: 1350 });

        // Create house elements with initial floating positions
        houseElements.forEach((element, index) => {
            const mesh = element.mesh;
            
            // Store the original target position
            const originalX = mesh.position.x;
            const originalY = element.targetY;
            const originalZ = mesh.position.z;
            
            // Start elements in random floating positions
            mesh.position.set(
                originalX + (Math.random() - 0.5) * 20,
                originalY + Math.random() * 10 + 15,
                originalZ + (Math.random() - 0.5) * 20
            );
            
            mesh.userData = {
                targetX: originalX,
                targetY: originalY,
                targetZ: originalZ,
                delay: element.delay,
                assembled: false
            };
            
            houseGroup.add(mesh);
        });

        // Camera position
        camera.position.set(12, 10, 12);
        camera.lookAt(0, 4, 0);

        // Create simple camera controls since OrbitControls isn't loading
        let isMouseDown = false;
        let lastMouseX = 0, lastMouseY = 0;
        let mouseX = 0, mouseY = 0;
        
        // Mouse event listeners for camera control
        renderer.domElement.addEventListener('mousedown', (event) => {
            isMouseDown = true;
            lastMouseX = event.clientX;
            lastMouseY = event.clientY;
        });
        
        renderer.domElement.addEventListener('mouseup', () => {
            isMouseDown = false;
        });
        
        renderer.domElement.addEventListener('mousemove', (event) => {
            if (isMouseDown) {
                const deltaX = event.clientX - lastMouseX;
                const deltaY = event.clientY - lastMouseY;
                
                // Get current camera position relative to house center
                const center = new THREE.Vector3(0, 4, 0);
                const radius = camera.position.distanceTo(center);
                
                // Calculate current spherical coordinates
                const direction = camera.position.clone().sub(center).normalize();
                let theta = Math.atan2(direction.x, direction.z);
                let phi = Math.acos(Math.max(-1, Math.min(1, direction.y)));
                
                // Update angles based on mouse movement
                theta -= deltaX * 0.01;
                phi += deltaY * 0.01;
                
                // Clamp phi to prevent flipping
                phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi));
                
                // Calculate new position
                camera.position.x = center.x + radius * Math.sin(phi) * Math.sin(theta);
                camera.position.y = center.y + radius * Math.cos(phi);
                camera.position.z = center.z + radius * Math.sin(phi) * Math.cos(theta);
                
                camera.lookAt(center);
                
                lastMouseX = event.clientX;
                lastMouseY = event.clientY;
            }
        });
        
        // Zoom with mouse wheel
        renderer.domElement.addEventListener('wheel', (event) => {
            const zoomSpeed = 0.1;
            const direction = event.deltaY > 0 ? 1 : -1;
            const distance = camera.position.distanceTo(new THREE.Vector3(0, 4, 0));
            const newDistance = Math.max(5, Math.min(30, distance + direction * zoomSpeed));
            
            const directionVector = camera.position.clone().sub(new THREE.Vector3(0, 4, 0)).normalize();
            camera.position.copy(new THREE.Vector3(0, 4, 0).add(directionVector.multiplyScalar(newDistance)));
        });
        
        // Create a simple controls object for compatibility
        const controls = {
            enabled: true,
            update: function() {
                // No update needed for simple controls
            }
        };

        // Animation variables
        let time = 0;
        const clock = new THREE.Clock();

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = clock.getDelta();
            time += deltaTime;

            // Animate house elements assembly
            houseElements.forEach((element, index) => {
                const mesh = element.mesh;
                const data = mesh.userData;
                
                if (time * 1000 > data.delay && !data.assembled) {
                    // Move element to target position
                    const targetPos = new THREE.Vector3(data.targetX, data.targetY, data.targetZ);
                    const currentPos = mesh.position;
                    
                    currentPos.lerp(targetPos, 0.015);
                    
                    // Check if element is close enough to target
                    if (currentPos.distanceTo(targetPos) < 0.1) {
                        data.assembled = true;
                        mesh.position.copy(targetPos);
                    }
                }
            });

            // Rotate entire house structure after assembly is complete (only if no user interaction)
            if (time > 15 && !controls.enabled) { // Start rotation after 15 seconds (when assembly is mostly complete)
                houseGroup.rotation.y += 0.003; // Slow rotation
            }

            // Update controls
            controls.update();

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Note: Auto-rotation is disabled since we're using custom controls
        // The house will rotate automatically after assembly is complete

        // Start animation
        animate();
        } // Close initScene function
    </script>
</body>
</html>
