<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GDM Corporate - Commercial Projects</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/commercial-projects.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .commercial-title {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
            animation-delay: 0.3s;
        }

        .project-card {
            opacity: 0;
            animation: fadeInRight 0.8s ease-out forwards;
        }

        .project-card:nth-child(1) { animation-delay: 0.5s; }
        .project-card:nth-child(2) { animation-delay: 0.7s; }
        .project-card:nth-child(3) { animation-delay: 0.9s; }
        .project-card:nth-child(4) { animation-delay: 1.1s; }
        .project-card:nth-child(5) { animation-delay: 1.3s; }

        .project-card:hover {
            transform: translateY(-10px);
            transition: transform 0.3s ease;
        }

        .project-image img {
            transition: transform 0.5s ease;
        }

        .project-card:hover .project-image img {
            transform: scale(1.05);
        }

        .back-link {
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
        }
    </style>
</head>

    <nav class="navigation">

    <div class="page-wrapper">
        <main class="commercial-container">

            <div class="projects-grid">
                <div class="project-card">
                    <a href="2dcaffe.html">

                                <div class="overlay-content">
                                    <h3>2D CAFFE</h3>
                                    <p>View Project</p>
                                </div>
                            </div>
                        </div>
                        <div class="project-content">

                        </div>
                    </a>
                </div>

                <div class="project-card">
                    <a href="mohdchan.html">
                        <div class="project-image">
                            <img src="../../assets/mohdchan.png" alt="Mohd Chan">
                            <div class="overlay">
                                <div class="overlay-content">
                                    <h3>MOHD CHAN</h3>
                                    <p>View Project</p>
                                </div>
                            </div>
                        </div>
                        <div class="project-content">
                            <h2>MOHD CHAN</h2>

                <div class="project-card">
                    <a href="miniso.html">
                        <div class="project-image">
                            <img src="../../assets/miniso.png" alt="Miniso">
                            <div class="overlay">
                                <div class="overlay-content">

                                    <p>View Project</p>
                                </div>
                            </div>
                        </div>
                        <div class="project-content">
                            <h2>MINISO</h2>
                        </div>
                    </a>
                </div>

                <div class="project-card">
                    <a href="#">
                        <div class="project-image">
                            <img src="../../assets/clinic.png" alt="Clinic Amal Siti">
                            <div class="overlay">
                                <div class="overlay-content">
                                    <h3>CLINIC AMAL SITI</h3>

                            </div>
                        </div>
                        <div class="project-content">
                            <h2>CLINIC AMAL SITI</h2>
                        </div>
                    </a>
                </div>

                <div class="project-card">
                    <a href="#">
                        <div class="project-image">
                            <img src="../../assets/snowflake.png" alt="Snow Flake">
                            <div class="overlay">
                                <div class="overlay-content">
                                    <h3>SNOW FLAKE</h3>

                                </div>
                            </div>

                        <div class="project-content">
                            <h2>SNOW FLAKE</h2>
                        </div>

            </div>
        </main>
    </div>
</body>
</html>
