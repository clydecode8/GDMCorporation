<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDM Construction Portfolio</title>
    <link rel="stylesheet" href="../css/commercial.css">
    <link rel="stylesheet" href="../css/components/header.css">
</head>
<body>
    <div id="header-component"></div>

    <div class="slider">
        <div class="featured-project">
            <div class="list">
                <div class="item active">
                    <div class="content">
                        <span class="category">Construction</span>
                        <h1>GDM CONSTRUCTION</h1>
                        <p class="description">
                            High-quality construction delivery for commercial and corporate spaces, from structural works to complete fit-outs.
                        </p>
                        <div class="cta-group">
                            <button class="cta-button primary" onclick="window.location.href='gdm-construction.html'">
                                <span class="icon">▶</span>View Project
                            </button>
                        </div>
                        <button type="button" class="thumbnail-toggle-btn mobile-inline-toggle-btn" onclick="document.getElementById('thumbnail-toggle-btn').click()">
                            <span class="toggle-icon">▼</span>
                            <span class="toggle-text">Show Projects</span>
                        </button>
                    </div>
                    <div class="featured-image">
                        <img src="../assets/construction1-section1.png" alt="Construction Project">
                    </div>
                </div>
            </div>
        </div>

        <div class="projects-row hidden" id="projects-row">
            <button class="close-projects-btn" id="close-projects-btn">×</button>
            <div class="thumbnail-container">
                <div class="thumbnail">
                    <a class="item active" data-index="0" href="gdm-construction.html">
                        <img src="../assets/construction1-section1.png" alt="GDM Construction">
                        <div class="item-content">
                            <h3>GDM CONSTRUCTION</h3>
                            <span class="category">Construction</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <div class="thumbnail-toggle-container" id="thumbnail-toggle">
            <button class="thumbnail-toggle-btn" id="thumbnail-toggle-btn">
                <span class="toggle-icon">▼</span>
                <span class="toggle-text">Show Projects</span>
            </button>
        </div>
    </div>

    <script src="../app.js"></script>
    <script>
        (function () {
            try {
                const isLandscape = window.matchMedia('(orientation: landscape)').matches;
                const isShort = window.matchMedia('(max-height: 450px)').matches;
                if (isLandscape && isShort) window.scrollTo(0, 0);
            } catch (e) {
                // no-op
            }
        })();
    </script>
</body>
</html>
