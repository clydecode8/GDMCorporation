<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GDM Construction Project</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/construction.css">
    <link rel="stylesheet" href="../css/components/contact-section.css">
    <link rel="stylesheet" href="../css/components/header.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="project-page">
    <div id="header-component"></div>

    <nav class="navigation">
        <a href="construction.html" class="back-link">← Back</a>
    </nav>

    <div class="scroll-container">
        <section class="section section-1">
            <div class="project-content">
                <div class="project-text" data-aos="fade-right">
                    <h1 class="project-title">GDM CONSTRUCTION</h1>
                    <p class="project-description">
                        High-quality construction delivery for commercial and corporate spaces, from structural works to complete fit-outs.
                    </p>
                    <a href="#section2" class="project-button scroll-btn">View gallery</a>
                </div>
                <div class="project-image" data-aos="fade-left">
                    <img src="../assets/construction1-section1.png" alt="GDM Construction project">
                </div>
            </div>
            <div class="scroll-indicator">
                <span>Scroll Down</span>
                <div class="scroll-down-arrow"></div>
            </div>
        </section>

        <section id="section2" class="section section-2">
            <div class="gallery-container">
                <div class="section-header" data-aos="fade-up">
                    <h2 class="section-title">Construction &amp; fit-out</h2>
                    <p class="section-description">
                        A closer look at our construction quality, materials, and finished spaces.
                    </p>
                </div>
                <div class="gallery-grid grid-layout-1">
                    <div class="gallery-column column-1">
                        <div class="gallery-item full-height-item" data-aos="fade-up">
                            <img src="../assets/construction1-section2-1.png" alt="GDM Construction interior 1">
                        </div>
                    </div>
                    <div class="gallery-column column-2">
                        <div class="small-photos-container">
                            <div class="gallery-item small-item" data-aos="fade-up" data-aos-delay="200">
                                <img src="../assets/construction1-section2-2.png" alt="GDM Construction interior 2">
                            </div>
                            <div class="gallery-item small-item" data-aos="fade-up" data-aos-delay="300">
                                <img src="../assets/construction1-section2-3.png" alt="GDM Construction interior 3">
                            </div>
                        </div>
                        <div class="gallery-item large-item" data-aos="fade-up" data-aos-delay="400">
                            <img src="../assets/construction1-section2-4.png" alt="GDM Construction interior 4">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="contact-section-container" style="--contact-bg-color: rgba(255, 255, 255, 0.6)"></section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('../components/contact-section.html')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    const container = document.getElementById('contact-section-container');
                    const temp = document.createElement('div');
                    temp.innerHTML = html;

                    const scripts = temp.getElementsByTagName('script');
                    const scriptContents = [];

                    while (scripts.length > 0) {
                        scriptContents.push(scripts[0].innerHTML);
                        scripts[0].remove();
                    }

                    container.innerHTML = temp.innerHTML;

                    scriptContents.forEach(scriptContent => {
                        const scriptElement = document.createElement('script');
                        scriptElement.textContent = scriptContent;
                        container.appendChild(scriptElement);
                    });

                    document.querySelectorAll('[data-aos]').forEach((element) => {
                        observer.observe(element);
                    });
                })
                .catch(error => {
                    console.error('Error loading contact section:', error);
                    document.getElementById('contact-section-container').innerHTML =
                        '<p style="text-align: center; padding: 2rem;">Error loading contact section. Please try refreshing the page.</p>';
                });
        });

        document.addEventListener('DOMContentLoaded', function() {
            fetch('../components/header.html')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    const headerContainer = document.getElementById('header-component');
                    headerContainer.innerHTML = html;
                })
                .catch(error => {
                    console.error('Error loading header component:', error);
                    document.getElementById('header-component').innerHTML =
                        '<p style="text-align: center; padding: 2rem;">Error loading header. Please try refreshing the page.</p>';
                });
        });

        document.querySelectorAll('.scroll-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                document.querySelector(targetId).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animate');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('[data-aos]').forEach((element) => {
            observer.observe(element);
        });
    </script>
    <script src="../app.js"></script>
</body>
</html>
